# Release ResonantJs: verify the build, publish package.json's version to npm,
# and create a GitHub release tagged v<version> with generated notes.
#
# Run it manually from the Actions tab (workflow_dispatch). Every step is
# idempotent, so re-running after a partial failure finishes the release
# instead of republishing: a version already on npm is not published again,
# and an existing tag is not re-created. When both already exist the run
# fails early and asks for a version bump.
#
# Creating a release by hand in the GitHub UI still publishes to npm, as the
# old workflow did. A release created by this workflow uses the Actions token,
# which does not trigger workflows, so there is no double publish.
#
# Authentication to npm uses trusted publishing (OIDC) by default: no token
# is stored anywhere, and provenance is attached automatically. One-time
# setup on npmjs.com: package resonantjs → Settings → Trusted Publisher →
# GitHub Actions, with user "amurgola", repository "ResonantJs", workflow
# filename "release.yml" and "npm publish" allowed. Trusted publishing needs
# npm 11.5.1 or newer, which Node 24 bundles. The "token" auth mode is a
# fallback that uses the npm_token secret (a granular access token with
# publish rights; classic tokens were revoked by npm in 2025 and fail with
# a 404 on publish).
name: Release

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm dist-tag to publish under
        type: string
        default: latest
      dry_run:
        description: Build and verify, run npm publish --dry-run, create nothing
        type: boolean
        default: false
      auth:
        description: npm authentication (trusted = OIDC trusted publisher, token = npm_token secret)
        type: choice
        options: [trusted, token]
        default: trusted
  release:
    types: [created]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write    # create the tag and release
  id-token: write    # OIDC token for npm trusted publishing and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Check npm supports trusted publishing (11.5.1+)
        run: node scripts/release-check.js --npm-version

      - run: npm ci

      - name: Build (runs the test suite, then minifies)
        run: npm run build

      - name: Verify the committed minified bundle is current
        run: |
          if ! git diff --quiet -- resonant.min.js resonant.min.js.map; then
            echo "::error::resonant.min.js is out of date. Run 'npm run build' and commit the result before releasing."
            git --no-pager diff --stat -- resonant.min.js resonant.min.js.map
            exit 1
          fi

      - name: Release preflight
        id: check
        run: node scripts/release-check.js --strict

      # Fails when the job has no OIDC token (id-token: write not granted),
      # records the claims npm will present, then performs npm's token
      # exchange so a trusted publisher mismatch fails here with the
      # registry's message instead of as an unexplained 404 from npm publish.
      - name: Verify npm accepts this workflow as a trusted publisher
        if: ${{ !inputs.dry_run && (inputs.auth || 'trusted') == 'trusted' }}
        run: node scripts/release-check.js --oidc-claims

      - name: Publish to npm (dry run)
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run --access public --tag "${{ inputs.npm_tag || 'latest' }}"

      # Trusted publishing: npm exchanges the job's OIDC token for a
      # short-lived registry credential and attaches provenance itself.
      - name: Publish to npm (trusted publishing)
        id: publish
        if: ${{ !inputs.dry_run && steps.check.outputs.published == 'false' && (inputs.auth || 'trusted') == 'trusted' }}
        run: npm publish --access public --tag "${{ inputs.npm_tag || 'latest' }}"

      - name: Publish to npm (token)
        id: publish_token
        if: ${{ !inputs.dry_run && steps.check.outputs.published == 'false' && inputs.auth == 'token' }}
        run: npm publish --provenance --access public --tag "${{ inputs.npm_tag || 'latest' }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}

      - name: Create tag and GitHub release
        id: release
        if: ${{ !inputs.dry_run && github.event_name == 'workflow_dispatch' && steps.check.outputs.tagged == 'false' }}
        run: |
          gh release create "${{ steps.check.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.check.outputs.tag }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## ${{ steps.check.outputs.name }} ${{ steps.check.outputs.version }}"
            echo
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Mode | ${{ inputs.dry_run && 'dry run' || github.event_name }} |"
            echo "| Auth | ${{ inputs.auth || 'trusted' }} |"
            echo "| npm | ${{ (steps.publish.outcome == 'success' || steps.publish_token.outcome == 'success') && format('published under dist-tag {0}', inputs.npm_tag || 'latest') || steps.check.outputs.published == 'true' && 'already published, skipped' || inputs.auth == 'token' && steps.publish_token.outcome || steps.publish.outcome }} |"
            echo "| GitHub release | ${{ steps.release.outcome == 'success' && format('created {0}', steps.check.outputs.tag) || steps.check.outputs.tagged == 'true' && 'tag already existed, skipped' || steps.release.outcome }} |"
            echo
            echo "https://www.npmjs.com/package/${{ steps.check.outputs.name }}/v/${{ steps.check.outputs.version }}"
            echo "https://github.com/${{ github.repository }}/releases/tag/${{ steps.check.outputs.tag }}"
          } >> "$GITHUB_STEP_SUMMARY"
